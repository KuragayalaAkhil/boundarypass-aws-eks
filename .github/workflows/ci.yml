name: BoundaryPass CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow the workflow to commit the updated Deployment manifest.
permissions:
  contents: write

jobs:
  infra-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Checkov
        run: python -m pip install checkov

      - name: Scan Terraform with Checkov
        run: checkov --directory infra --framework terraform

      - name: Scan Kubernetes manifests with Checkov
        run: checkov --directory k8s --framework kubernetes

  test-build-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -v --cov=app --cov-report=xml:coverage.xml

      - name: Scan code with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Docker image
        run: docker build -t boundarypass:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: boundarypass:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag boundarypass:ci kuragayalaakhil/boundarypass:${{ github.sha }}
          docker tag boundarypass:ci kuragayalaakhil/boundarypass:latest
          docker push kuragayalaakhil/boundarypass:${{ github.sha }}
          docker push kuragayalaakhil/boundarypass:latest

      - name: Download yq
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 -o /tmp/yq
          chmod +x /tmp/yq
          /tmp/yq --version

      - name: Update Deployment image and commit manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: kuragayalaakhil/boundarypass:${{ github.sha }}
        run: |
          # Check main again; another run may have recorded this image.
          git fetch origin main
          remote_image="$(git show origin/main:k8s/deployment.yaml |
            /tmp/yq -r '.spec.template.spec.containers[0].image')"

          if [ "$remote_image" = "$IMAGE" ]; then
            echo "Image is already recorded on main."
            exit 0
          fi

          # Do not replace the image selected by a newer source commit.
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced; skipping this older image update."
            exit 0
          fi

          /tmp/yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Update BoundaryPass image to ${GITHUB_SHA}"

          if git push origin HEAD:main; then
            exit 0
          fi

          # Treat an identical concurrent update as success.
          git fetch origin main
          remote_image="$(git show origin/main:k8s/deployment.yaml |
            /tmp/yq -r '.spec.template.spec.containers[0].image')"
          if [ "$remote_image" = "$IMAGE" ]; then
            echo "Another run recorded the same image."
            exit 0
          fi

          # A newer push has its own workflow run.
          echo "main changed during this run; skipping its stale image update."
