grafana:
  persistence:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 24h

    # Store metrics on a persistent, encrypted 10 GiB EBS volume.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-encrypted
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

    # Set CPU and memory requirements for the Prometheus pod.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1500Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi

# EKS manages these control-plane components; their metrics endpoints
# are not exposed to this cluster's Prometheus installation.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
