apiVersion: apps/v1
kind: Deployment
metadata:
  name: boundarypass
  annotations:
    checkov.io/skip1: CKV_K8S_21=Application and ingress currently run in the default namespace
    checkov.io/skip2: CKV_K8S_43=CI uses a commit-specific image tag; digest pinning is deferred
    checkov.io/skip3: CKV2_K8S_6=EKS network policy enforcement is not configured for this lab
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: boundarypass
  template:
    metadata:
      labels:
        app: boundarypass
    spec:
      # EKS Pod Identity maps this account to the limited database IAM role.
      serviceAccountName: boundarypass-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
          # Spread each deployment revision across both availability zones.
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: boundarypass
      containers:
        - name: boundarypass
          image: kuragayalaakhil/boundarypass:a77c1d71a22c6f627322db696526409e6f2d0186
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8000
          env:
            # Pod Identity supplies AWS credentials; no database password is mounted.
            - name: DATABASE_AUTH_MODE
              value: iam
            - name: DATABASE_HOST
              value: boundarypass-db.cvoqeo60akme.ap-south-1.rds.amazonaws.com
            - name: AWS_REGION
              value: ap-south-1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
