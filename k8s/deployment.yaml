apiVersion: apps/v1
kind: Deployment
metadata:
  name: boundarypass
  annotations:
    checkov.io/skip1: CKV_K8S_21=Namespace migration requires moving the live Secret and ingress
    checkov.io/skip2: CKV_K8S_43=CI uses a commit-specific image tag; digest pinning is deferred
    checkov.io/skip3: CKV_K8S_35=Application currently reads the managed database Secret from an environment variable
    checkov.io/skip4: CKV2_K8S_6=EKS network policy enforcement is not configured for this lab
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: boundarypass
  template:
    metadata:
      labels:
        app: boundarypass
    spec:
      # EKS Pod Identity maps this account to the limited database IAM role.
      serviceAccountName: boundarypass-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: boundarypass
      containers:
        - name: boundarypass
          image: kuragayalaakhil/boundarypass:5773fc6b8b70c610e3dba6a8bf53487ac33a6361
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boundarypass-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
