apiVersion: apps/v1
kind: Deployment
metadata:
  name: boundarypass
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: boundarypass
  template:
    metadata:
      labels:
        app: boundarypass
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: boundarypass
      containers:
        - name: boundarypass
          image: kuragayalaakhil/boundarypass:4aa687207211d3d7085c5ac4788c6d763bf132fb
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boundarypass-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
