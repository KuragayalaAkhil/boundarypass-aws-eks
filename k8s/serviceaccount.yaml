apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    checkov.io/skip1: CKV_K8S_21=ServiceAccount stays with the live application in the default namespace
  # EKS Pod Identity associates this service account with the app IAM role.
  name: boundarypass-app
  namespace: default
# Pod Identity injects its own projected token when this account is used.
automountServiceAccountToken: false
